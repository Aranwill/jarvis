[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malak"
version = "0.6.0-alpha"
description = "Personal Cognitive Platform"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["malak*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]